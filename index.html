<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сайт организации</title>
<style>
:root { color-scheme: light dark; --bg:#f6f7f9; --fg:#1c2430; --rule:#d5dae1; }
@media (prefers-color-scheme: dark) { :root { --bg:#14181f; --fg:#eef1f5; --rule:#2c3440; } }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
main { max-width: 28rem; width: 100%; text-align: center; }
h1 { margin: 0; font-size: clamp(1.6rem, 6vw, 2.2rem); font-weight: 600; line-height: 1.25; }
hr { width: 3rem; border: 0; border-top: 2px solid var(--rule); margin: 1.25rem auto 0; }
</style>
</head>
<body>
<main>
  <h1>У меня нету сайта организации</h1>
  <hr>
</main>
</body>
</html>
